name: Train model in Azure ML and redeploy API

on:
  push:
    branches: [master]
    paths:
      - "training/**"
      - "train_V2_cleaned.csv"
      - ".github/workflows/train-and-deploy-model.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_WORKSPACE: ${{ secrets.AZURE_WORKSPACE }}
  AZURE_LOCATION: ${{ secrets.AZURE_LOCATION }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}

jobs:
  train-build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Azure ML workspace
        run: |
          az extension add --name ml --upgrade
          az group show --name "$AZURE_RESOURCE_GROUP" >/dev/null 2>&1 || az group create --name "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION"
          az ml workspace create --name "$AZURE_WORKSPACE" --resource-group "$AZURE_RESOURCE_GROUP" --location "$AZURE_LOCATION"
          az ml compute create --name cpu-cluster --type amlcompute --min-instances 0 --max-instances 1 --size Standard_DS3_v2 --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_WORKSPACE" || true

      - name: Submit Azure ML training job
        id: train
        run: |
          JOB_NAME=$(az ml job create --file training/azure_job.yml --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_WORKSPACE" --query name -o tsv)
          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"
          az ml job stream --name "$JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_WORKSPACE"
          az ml job download --name "$JOB_NAME" --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_WORKSPACE" --download-path azureml-artifacts --all

      - name: Prepare trained model artifacts
        run: |
          rm -rf models
          mkdir -p models
          find azureml-artifacts -name "*.joblib" -exec cp {} models/ \;
          find azureml-artifacts -name "model_metadata.json" -exec cp {} models/ \;
          test -f models/profit_model.joblib
          test -f models/damage_incidence_model.joblib
          test -f models/damage_amount_model.joblib
          test -f models/model_metadata.json

      - name: Register model artifact in Azure ML
        run: |
          az ml model create --name customer-value-model --type custom_model --path models --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_WORKSPACE"

      - name: Set image names
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image with new model
        run: |
          docker compose build api
          docker compose push api
          docker tag "${IMAGE_PREFIX}/customer-api:${IMAGE_TAG}" "${IMAGE_PREFIX}/customer-api:latest"
          docker push "${IMAGE_PREFIX}/customer-api:latest"

      - name: Connect kubectl to AKS
        run: |
          az aks get-credentials --resource-group "$AZURE_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing

      - name: Redeploy API with rolling update
        run: |
          sed -i "s#ghcr.io/OWNER/REPO#${IMAGE_PREFIX}#g" k8s/*.yml
          kubectl apply -k k8s
          kubectl -n customer-ml set image deployment/customer-api api="${IMAGE_PREFIX}/customer-api:${IMAGE_TAG}"
          kubectl -n customer-ml rollout status deployment/customer-api --timeout=180s

      - name: Scale Azure ML compute to zero
        if: always()
        run: |
          az ml compute update --name cpu-cluster --min-instances 0 --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_WORKSPACE" || true
