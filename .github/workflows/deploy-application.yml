name: 3 - Deploy application services

on:
  push:
    branches: [master]
    paths:
      - "api/**"
      - "docker-compose.yml"
      - "env/**"
      - "frontend/**"
      - "nginx/**"
      - "k8s/**"
      - "requirements.txt"
      - "score_cleaned.csv"
      - ".github/workflows/deploy-application.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: customer-ml-aks-deployment
  cancel-in-progress: false

env:
  AZURE_RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  AZURE_WORKSPACE: ${{ secrets.AZURE_WORKSPACE }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore latest registered model for API image
        run: |
          az extension add --name ml --upgrade
          rm -rf models
          mkdir -p models
          MODEL_VERSION=$(az ml model list --name customer-value-model --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_WORKSPACE" --query "max_by([], &to_number(version)).version" -o tsv)
          if [ -z "$MODEL_VERSION" ]; then
            echo "No registered Azure ML model named customer-value-model was found. Run the training workflow first."
            exit 1
          fi
          az ml model download --name customer-value-model --version "$MODEL_VERSION" --download-path downloaded-model --resource-group "$AZURE_RESOURCE_GROUP" --workspace-name "$AZURE_WORKSPACE"
          find downloaded-model -name "*.joblib" -exec cp {} models/ \;
          find downloaded-model -name "model_metadata.json" -exec cp {} models/ \;
          test -f models/profit_model.joblib
          test -f models/damage_incidence_model.joblib
          test -f models/damage_amount_model.joblib
          test -f models/model_metadata.json

      - name: Set image names
        run: |
          echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application images
        run: |
          docker compose build api frontend nginx
          docker compose push api frontend nginx
          for service in api frontend nginx; do
            docker tag "${IMAGE_PREFIX}/customer-${service}:${IMAGE_TAG}" "${IMAGE_PREFIX}/customer-${service}:latest"
            docker push "${IMAGE_PREFIX}/customer-${service}:latest"
          done

      - name: Connect kubectl to AKS
        run: |
          az aks get-credentials --resource-group "$AZURE_RESOURCE_GROUP" --name "$AKS_CLUSTER_NAME" --overwrite-existing

      - name: Configure cluster image pull secret
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PAT || github.token }}
        run: |
          kubectl create namespace customer-ml --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n customer-ml create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username="$GHCR_USERNAME" \
            --docker-password="$GHCR_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests and roll deployments
        run: |
          sed -i "s#ghcr.io/OWNER/REPO#${IMAGE_PREFIX}#g" k8s/*.yml
          kubectl apply -k k8s
          kubectl -n customer-ml set image deployment/customer-api api="${IMAGE_PREFIX}/customer-api:${IMAGE_TAG}"
          kubectl -n customer-ml set image deployment/customer-frontend frontend="${IMAGE_PREFIX}/customer-frontend:${IMAGE_TAG}"
          kubectl -n customer-ml set image deployment/customer-nginx nginx="${IMAGE_PREFIX}/customer-nginx:${IMAGE_TAG}"
          kubectl -n customer-ml rollout status deployment/customer-api --timeout=180s
          kubectl -n customer-ml rollout status deployment/customer-frontend --timeout=180s
          kubectl -n customer-ml rollout status deployment/customer-nginx --timeout=180s
