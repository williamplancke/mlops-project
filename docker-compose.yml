services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - env/postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - env/api.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      default:
        aliases:
          - customer-api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    networks:
      default:
        aliases:
          - customer-frontend

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  postgres-data:
