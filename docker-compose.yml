services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: customer_ml
      POSTGRES_PASSWORD: customer_ml_password
      POSTGRES_DB: predictions
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U customer_ml -d predictions"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      MODEL_DIR: /app/models
      DATABASE_URL: postgresql+psycopg://customer_ml:customer_ml_password@postgres:5432/predictions
      DAMAGE_THRESHOLD: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      default:
        aliases:
          - customer-api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    networks:
      default:
        aliases:
          - customer-frontend

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  postgres-data:
