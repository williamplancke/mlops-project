apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-api
  namespace: customer-ml
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: customer-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: customer-api
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/REPO/customer-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_DIR
              value: /app/models
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 1536Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-api
  namespace: customer-ml
spec:
  selector:
    app: customer-api
  ports:
    - port: 8000
      targetPort: 8000
