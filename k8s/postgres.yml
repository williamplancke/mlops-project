apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: customer-ml
type: Opaque
stringData:
  POSTGRES_USER: customer_ml
  POSTGRES_PASSWORD: change-me-in-cluster
  POSTGRES_DB: predictions
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  PGDATA: /var/lib/postgresql/data/pgdata
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: customer-ml
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: customer-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-secret
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "customer_ml"]
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: customer-ml
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
