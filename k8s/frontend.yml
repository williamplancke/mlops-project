apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-frontend
  namespace: customer-ml
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: customer-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: customer-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/OWNER/REPO/customer-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-frontend
  namespace: customer-ml
spec:
  selector:
    app: customer-frontend
  ports:
    - port: 80
      targetPort: 80
